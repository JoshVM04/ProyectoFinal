<!-- This file extends the base template (base.html) -->
<!-- It shows the login form for users to access their account -->
{% extends "base.html" %}

<!-- Changes the page title that appears in the browser tab - SPANISH -->
{% block title %}Iniciar Sesión - Nómada{% endblock %}

<!-- Main content block - everything inside here goes into base.html -->
{% block content %}
<!-- Full height container with gradient background -->
<div class="min-h-screen bg-gradient-to-br from-primary-50 to-white py-16">
    <!-- Center content container with responsive padding -->
    <div class="container mx-auto px-4">
        <!-- Limits the width to medium size (good for forms) -->
        <div class="max-w-md mx-auto">
            <!-- White card with shadow and rounded corners -->
            <!-- animate-scale-in makes it fade and grow when page loads -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden animate-scale-in">
                <!-- Header section with dark blue background - SPANISH -->
                <div class="bg-primary-500 py-8 text-center">
                    <!-- Logo: N and omada with different styles -->
                    <div class="flex items-center justify-center gap-0 mb-2">
                        <span class="text-5xl font-bold text-white">N</span>
                        <span class="text-5xl font-light text-white/90">ómada</span>
                    </div>
                    <!-- Welcome message - SPANISH -->
                    <p class="text-white/90 text-sm">Bienvenido de nuevo</p>
                </div>
                
                <!-- Login form section -->
                <div class="p-8">
                    <!-- Form sends POST request to auth.login route -->
                    <!-- method="POST" means data is sent securely, not shown in URL -->
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <!-- Email field container - SPANISH -->
                        <div class="mb-5">
                            <!-- Label for email input - clicking it focuses the input -->
                            <label class="block text-gray-700 text-sm font-medium mb-2">
                                <!-- Envelope icon from Font Awesome -->
                                <i class="fas fa-envelope text-primary-500 mr-2"></i>Correo electrónico
                            </label>
                            <!-- Email input field -->
                            <!-- type="email" validates it's a real email format -->
                            <!-- name="email" is how Flask gets this value -->
                            <!-- required means form won't submit if empty -->
                            <input type="email" name="email" required
                                   class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                   placeholder="tucorreo@email.com">
                        </div>
                        
                        <!-- Password field container - SPANISH -->
                        <div class="mb-5">
                            <label class="block text-gray-700 text-sm font-medium mb-2">
                                <i class="fas fa-lock text-primary-500 mr-2"></i>Contraseña
                            </label>
                            <!-- type="password" hides the characters with dots -->
                            <input type="password" name="password" required
                                   class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                   placeholder="••••••••">
                        </div>
                        
                        <!-- Remember me and forgot password row - SPANISH -->
                        <div class="flex items-center justify-between mb-6">
                            <!-- Checkbox container - SPANISH -->
                            <label class="flex items-center">
                                <!-- Checkbox input -->
                                <input type="checkbox" class="rounded border-gray-300 text-primary-500 focus:ring-primary-500">
                                <span class="ml-2 text-sm text-gray-600">Recordarme</span>
                            </label>
                            <!-- Forgot password link - SPANISH -->
                            <!-- # means it goes nowhere for now - will update later -->
                            <a href="#" class="text-sm text-primary-600 hover:text-primary-700 hover:underline transition-all">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>
                        
                        <!-- Submit button - SPANISH -->
                        <!-- type="submit" triggers the form submission -->
                        <button type="submit" 
                                class="w-full bg-primary-500 hover:bg-primary-600 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-sign-in-alt"></i>
                            Iniciar Sesión
                        </button>
                    </form>
                    
                    <!-- Link to registration page for new users - SPANISH -->
                    <div class="mt-6 text-center">
                        <p class="text-gray-600 text-sm">
                            ¿No tienes una cuenta? 
                            <!-- url_for generates the correct URL for register page -->
                            <a href="{{ url_for('auth.register') }}" class="text-primary-600 hover:text-primary-700 font-semibold hover:underline transition-all">
                                Regístrate aquí
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
